name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install linters
        run: |
          python -m pip install ruff
          sudo apt-get update
          sudo apt-get install -y shellcheck tmux
      - name: Python checks
        run: |
          python bin/tmux-codex-auto-continue --self-test
          python tests/worked_integration.py
          python tests/install_integration.py
          python -m py_compile bin/tmux-codex-auto-continue
          python -m py_compile tests/worked_integration.py
          python -m py_compile tests/install_integration.py
          ruff check bin/tmux-codex-auto-continue
          ruff check tests/worked_integration.py
          ruff check tests/install_integration.py
          test "$(sed -n 's/^VERSION=//p' install.sh)" = "v$(python bin/tmux-codex-auto-continue --version)"
          printf '%s  %s\n' "$(sed -n 's/^WATCHER_SHA256=//p' install.sh)" bin/tmux-codex-auto-continue | sha256sum --check --status
          sha256sum --check SHA256SUMS
      - name: Shell checks
        run: shellcheck install.sh uninstall.sh tmux-codex-auto-continue.tmux
